name: TBS RSS Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Start Redis
        run: |
          docker network create trawl-net
          docker run -d \
            --name redis \
            --network trawl-net \
            redis:alpine

      - name: Start Trawl
        run: |
          docker run -d \
            --name trawl \
            --network trawl-net \
            -p 8191:8191 \
            -e REDIS_URL=redis://redis:6379 \
            -e BROWSER_POOL_SIZE=2 \
            -e RESIDENTIAL_PROXY_URL=${{ secrets.WEBSHARE_PROXY_URL }} \
            ghcr.io/germondai/trawl:latest

      - name: Wait for Trawl
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8191/health && echo 'Trawl ready' && exit 0
            sleep 2
          done
          docker logs trawl && exit 1
      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8191/health && break
            sleep 2
          done

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push XML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml *.json
          git diff --cached --quiet || git commit -m "chore: update RSS feeds [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push